name: Update profile art

"on":
  schedule:
    - cron: "17 6 * * *"   # ~06:17 UTC daily (11:47 IST)
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/fetch_contributions.py
      - run: python scripts/render_heatmap_svg.py
      # LeetCode sometimes blocks datacenter IPs; if that happens the
      # committed card simply stays as-is instead of failing the run.
      - run: python scripts/fetch_leetcode.py && python scripts/render_leetcode_svg.py
        continue-on-error: true
      - run: python scripts/render_streak_cards.py
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh profile art [skip ci]"
          file_pattern: "data/contributions.json contrib-heatmap.svg data/leetcode.json leetcode-card.svg leetcode-streak.svg"
